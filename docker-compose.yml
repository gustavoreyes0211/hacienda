version: '3.8'

services:
  # 1. Base de Datos PostgreSQL para Producción
  db:
    image: postgres:16-alpine
    container_name: hacienda_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_seguro_2026}
      POSTGRES_DB: ${POSTGRES_DB:-sistema_hacienda}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sistema_hacienda}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Aplicación Principal Next.js 16 (POS, DTE y Stripe)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hacienda_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_seguro_2026}@db:5432/${POSTGRES_DB:-sistema_hacienda}?schema=public
      - NODE_ENV=production

volumes:
  postgres_data:
